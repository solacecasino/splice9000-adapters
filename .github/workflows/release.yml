# Builds and tests the adapters in this repo on every kind of computer
# splice9000 runs on, and on a tag like v0.2.0 publishes them as a release
# (then points the catalog at the new downloads). Compiled adapters get a
# zip per platform; presets get one zip for all. Run it by hand to get the
# zips as artifacts without releasing.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["CATALOG.md", "catalog.json"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest }
          - { os: macos-15-intel }
          - { os: windows-latest, ffmpeg: win64 }
          - { os: windows-11-arm, ffmpeg: winarm64 }
          - { os: ubuntu-22.04, presets: true }
          - { os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scene-split
            silence-cut
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            macOS) brew install ffmpeg ;;
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            Windows)
              mkdir -p ffmpeg && cd ffmpeg
              gh release download latest --repo BtbN/FFmpeg-Builds -p "ffmpeg-master-latest-${{ matrix.ffmpeg }}-gpl.zip"
              unzip -q ffmpeg-*.zip
              echo "$(cygpath -w "$(echo $PWD/ffmpeg-*/bin)")" >> "$GITHUB_PATH" ;;
          esac
      - name: Unit tests
        shell: bash
        run: |
          for a in scene-split silence-cut waveforms thumbnails shuttle crossfades; do (cd $a && cargo test); done
      - name: Package
        shell: bash
        run: |
          rm -rf build && mkdir build
          # The Rust adapters include sdk/rust/splice.rs from beside them.
          cp -R sdk scene-split silence-cut waveforms thumbnails shuttle crossfades build/
          # Presets (and other adapters with no program) run everywhere: one
          # zip, made once.
          if [ "${{ matrix.presets }}" = true ]; then cp -R loudness-normalize snapping build/; fi
          python scripts/build.py --root build
          ls dist
      - name: Test the built programs as splice9000 runs them
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          python scripts/test_scene_split.py "build/scene-split/scene-split$exe"
          python scripts/test_silence_cut.py "build/silence-cut/silence-cut$exe"
          python scripts/test_loudness.py
          python scripts/test_editing.py build
      - uses: actions/upload-artifact@v4
        with:
          name: adapters-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$tag" dist/* --title "splice9000 adapters ${tag#v}" "$@"
          gh workflow run catalog.yml --ref main
